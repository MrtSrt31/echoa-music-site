<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Echoa Music</title>
<style>
  :root {
    --accent: #016ab8;
    --bg: #0c0c0e;
    --surface: #1a1a1d;
    --text: #f2f2f5;
    --muted: #9a9aa2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    text-align: center;
  }
  img {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    box-shadow: 0 12px 40px rgba(1,106,184,0.45);
    margin-bottom: 20px;
  }
  h1 { margin: 0 0 24px; }
  .langs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 480px;
  }
  .langs a {
    color: var(--text);
    background: var(--surface);
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.95rem;
  }
  .langs a:hover { color: var(--accent); }
</style>
<script>
  (function () {
    var supported = ['en', 'tr', 'de', 'zh', 'ru', 'el', 'es', 'fa', 'ar'];
    var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    if (supported.indexOf(lang) === -1) lang = 'en';
    window.location.replace(lang + '/index.html');
  })();
</script>
</head>
<body>
  <img src="assets/icon.png" alt="Echoa Music logo" />
  <h1>Echoa Music</h1>
  <p>Redirecting… / Yönlendiriliyor…</p>
  <div class="langs">
    <a href="en/index.html">English</a>
    <a href="tr/index.html">Türkçe</a>
    <a href="de/index.html">Deutsch</a>
    <a href="es/index.html">Español</a>
    <a href="ru/index.html">Русский</a>
    <a href="el/index.html">Ελληνικά</a>
    <a href="zh/index.html">中文</a>
    <a href="fa/index.html">فارسی</a>
    <a href="ar/index.html">العربية</a>
  </div>
</body>
</html>
